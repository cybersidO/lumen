org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8

# This machine cannot reliably spare the memory for a second JVM, so Kotlin's own compile
# daemon fails to start, burns four connection retries, and only then falls back to
# compiling in the Gradle daemon anyway — which turned a small incremental compile into 17
# minutes. Asking for that fallback up front skips the retries. Revert to the default
# (daemon) on a machine with headroom: it is faster there.
kotlin.compiler.execution.strategy=in-process
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# jitpack.io — which hosts the PDFium JNI bindings M8 needs, and is the only place they
# are published — terminates Gradle's TLS 1.3 handshake mid-negotiation. The same host is
# reachable over 1.2 from curl, from a plain JVM HttpClient, and from Gradle once this is
# set, so this is a quirk of that host rather than of this machine. Without it the build
# cannot resolve dependencies at all on a clean cache.
#
# This is JVM-wide, so Maven Central and Google are negotiated at 1.2 too. That is a real
# if small downgrade — 1.2 with modern ciphers is still sound, and every artifact is
# checksum-verified by Gradle regardless — and it is the cost of a dependency that is not
# on Central. See DECISIONS.md for the alternative (vendoring the AARs) and why it was not
# taken yet.
systemProp.https.protocols=TLSv1.2

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
